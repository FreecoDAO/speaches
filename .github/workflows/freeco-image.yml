# Build FreEco.ai's CPU image of speaches from this fork.
#
# FreEco.ai runs speaches as its local speech-to-text and text-to-speech
# service, so dictation and voice calls stay on the machine instead of going to
# a cloud transcriber. The image is built here, from the audited fork, and
# published to this account's registry, so what runs traces to a commit here
# rather than to upstream's latest tag.
#
# CPU only: the machines FreEco.ai targets have no discrete GPU, and Whisper
# small/base is practical on a CPU in a way a local LLM is not.
name: FreEco image

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: freeco-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (registry paths must be lowercase)
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/speaches" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=ubuntu:24.04
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}-cpu
            ${{ steps.img.outputs.repo }}:latest-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
